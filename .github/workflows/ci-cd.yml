
name: CI/CD - Stokly Inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI - Linter & Test)
  # ==========================================

  test:
    name: CI - Linter, Unit Test & Config Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix backend

      - name: Linter & Syntax Checks
        run: |
          npm run lint --prefix backend
          node --check frontend/app.js
          node --check scripts/smoke-test.mjs

      - name: Run Unit Tests
        run: npm test --prefix backend

      - name: Validate Docker Compose Configurations
        run: |
          cp .env.example .env
          docker compose config --quiet
          IMAGE_PREFIX="joelsstr/stokly" docker compose -f compose.prod.yaml config --quiet

  # ==========================================
  # 2. CONTINUOUS DELIVERY - DOCKER HUB
  # ==========================================

  publish:
    name: CD - Publish Images to Docker Hub
    needs: test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            joelsstr/stokly-api:latest
            joelsstr/stokly-api:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            joelsstr/stokly-web:latest
            joelsstr/stokly-web:${{ github.sha }}

