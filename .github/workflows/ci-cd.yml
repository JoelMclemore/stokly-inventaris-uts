
name: CI/CD - Stokly Inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================
  # 1. CONTINUOUS INTEGRATION (CI)
  # ==========================================

  test:
    name: CI - Test + Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix backend

      - name: Syntax and Unit Tests
        run: |
          npm run check --prefix backend
          npm test --prefix backend
          node --check frontend/app.js
          node --check scripts/smoke-test.mjs

      - name: Start 4 Docker Containers
        run: |
          cp .env.example .env
          docker compose up -d --build

      - name: CRUD Integration Test
        run: node scripts/smoke-test.mjs

      - name: Show Container Logs if Failed
        if: failure()
        run: docker compose logs --tail=80

      - name: Stop Test Containers
        if: always()
        run: docker compose down -v

  # ==========================================
  # 2. CONTINUOUS DELIVERY - DOCKER HUB
  # ==========================================

  publish:
    name: CD - Publish Images to Docker Hub
    needs: test

    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            joelsstr/stokly-api:latest
            joelsstr/stokly-api:${{ github.sha }}

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            joelsstr/stokly-web:latest
            joelsstr/stokly-web:${{ github.sha }}

  # ==========================================
  # 3. CD - WINDOWS DOCKER DESKTOP
  # ==========================================

  deploy_local:
    name: CD - Deploy to Windows Docker Desktop
    needs: publish

    if: vars.ENABLE_LOCAL_DEPLOY == 'true'

    runs-on: [self-hosted, Windows, X64, stokly-local]
    timeout-minutes: 30

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Deploy Images from Docker Hub
        shell: powershell

        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.LOCAL_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.LOCAL_MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.LOCAL_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.LOCAL_MYSQL_PASSWORD }}

          APP_PORT: ${{ vars.LOCAL_APP_PORT || '8080' }}
          ADMIN_PORT: ${{ vars.LOCAL_ADMIN_PORT || '8081' }}

          IMAGE_TAG: ${{ github.sha }}

        run: |
          $ErrorActionPreference = 'Stop'

          # Pastikan GitHub Secrets database tersedia
          $requiredSecrets = @(
            'MYSQL_ROOT_PASSWORD',
            'MYSQL_DATABASE',
            'MYSQL_USER',
            'MYSQL_PASSWORD'
          )

          foreach ($key in $requiredSecrets) {
            $value = [Environment]::GetEnvironmentVariable($key)

            if ([string]::IsNullOrWhiteSpace($value)) {
              throw "GitHub secret $key belum dikonfigurasi."
            }
          }

          Write-Host "Mengambil Docker image dari Docker Hub..."

          # Download image backend dari Docker Hub
          docker pull "joelsstr/stokly-api:$env:IMAGE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal mengambil image backend dari Docker Hub."
          }

          # Download image frontend dari Docker Hub
          docker pull "joelsstr/stokly-web:$env:IMAGE_TAG"

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal mengambil image frontend dari Docker Hub."
          }

          # Membuat konfigurasi tambahan untuk Docker Hub
          $overridePath = Join-Path $env:RUNNER_TEMP 'stokly-dockerhub.override.yaml'

          $overrideContent = @(
            'services:'
            '  api:'
            '    image: joelsstr/stokly-api:${IMAGE_TAG}'
            '  web:'
            '    image: joelsstr/stokly-web:${IMAGE_TAG}'
          )

          $overrideContent | Set-Content -Path $overridePath -Encoding UTF8

          Write-Host "Memvalidasi Docker Compose..."

          docker compose -f compose.yaml -f $overridePath config --quiet

          if ($LASTEXITCODE -ne 0) {
            throw "Konfigurasi Docker Compose tidak valid."
          }

          Write-Host "Menjalankan container Stokly..."

          # Menggunakan image Docker Hub tanpa build ulang
          docker compose -f compose.yaml -f $overridePath up -d --no-build

          if ($LASTEXITCODE -ne 0) {
            throw "Deployment Docker Compose gagal."
          }

          Write-Host "Menampilkan status container..."

          docker compose -f compose.yaml -f $overridePath ps

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal memeriksa status container."
          }

          Write-Host "Proses deployment container selesai."

      - name: Verify Website and MySQL Database
        shell: powershell

        env:
          LOCAL_APP_PORT: ${{ vars.LOCAL_APP_PORT || '8080' }}

        run: |
          $url = "http://127.0.0.1:$env:LOCAL_APP_PORT/api/health"

          Write-Host "Memeriksa website dan koneksi database..."

          for ($attempt = 1; $attempt -le 60; $attempt++) {

            try {
              $health = Invoke-RestMethod -Uri $url -TimeoutSec 3

              if (
                $health.status -eq 'ok' -and
                $health.database -eq 'connected'
              ) {
                Write-Host "Deployment berhasil!"
                Write-Host "Website Stokly berjalan."
                Write-Host "Database MySQL terhubung."
                exit 0
              }
            }
            catch {
              Write-Host "Aplikasi belum siap. Percobaan $attempt..."
            }

            Start-Sleep -Seconds 2
          }

          throw "Deployment gagal: website atau MySQL belum siap."

  # ==========================================
  # 4. CD - DEPLOY KE VPS (OPSIONAL)
  # ==========================================

  deploy:
    name: CD - Deploy to VPS (optional)
    needs: publish

    if: vars.ENABLE_VPS_DEPLOY == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

        run: |
          install -m 700 -d ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Transfer Compose and Deploy from Docker Hub
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}

        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/database'"

          scp compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.prod.yaml"

          scp database/init.sql "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/database/init.sql"

          IMAGE_PREFIX="joelsstr/stokly"

          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' docker compose -f compose.prod.yaml pull && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' docker compose -f compose.prod.yaml up -d"
