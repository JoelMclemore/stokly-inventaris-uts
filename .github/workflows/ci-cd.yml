name: CI/CD - Stokly Inventory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CI - Test + Docker Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --prefix backend
      - name: Syntax and unit tests
        run: |
          npm run check --prefix backend
          npm test --prefix backend
          node --check frontend/app.js
          node --check scripts/smoke-test.mjs
      - name: Start 4 containers
        run: |
          cp .env.example .env
          docker compose up -d --build
      - name: CRUD integration test
        run: node scripts/smoke-test.mjs
      - name: Container logs if failed
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop test containers
        if: always()
        run: docker compose down -v

  publish:
    name: CD - Publish images to GHCR
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Normalize GHCR repository name
        id: image
        run: echo "prefix=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-api:latest
            ${{ steps.image.outputs.prefix }}-api:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ steps.image.outputs.prefix }}-web:latest
            ${{ steps.image.outputs.prefix }}-web:${{ github.sha }}

  deploy_local:
    name: CD - Deploy to Windows Docker Desktop (optional)
    needs: publish
    if: vars.ENABLE_LOCAL_DEPLOY == 'true'
    runs-on: [self-hosted, Windows, X64, stokly-local]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deploy containers to Docker Desktop
        shell: powershell
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.LOCAL_MYSQL_ROOT_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.LOCAL_MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.LOCAL_MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.LOCAL_MYSQL_PASSWORD }}
          APP_PORT: ${{ vars.LOCAL_APP_PORT || '8080' }}
          ADMIN_PORT: ${{ vars.LOCAL_ADMIN_PORT || '8081' }}
        run: |
          foreach ($key in @('MYSQL_ROOT_PASSWORD', 'MYSQL_DATABASE', 'MYSQL_USER', 'MYSQL_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($key))) {
              throw "GitHub secret $key belum dikonfigurasi."
            }
          }
          docker compose config --quiet
          docker compose up -d --build
          docker compose ps
      - name: Verify deployed website and database
        shell: pwsh
        env:
          LOCAL_APP_PORT: ${{ vars.LOCAL_APP_PORT || '8080' }}
        run: |
          $url = "http://127.0.0.1:$env:LOCAL_APP_PORT/api/health"
          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $health = Invoke-RestMethod -Uri $url -TimeoutSec 3
              if ($health.status -eq 'ok' -and $health.database -eq 'connected') {
                Write-Host 'Deployment sukses: API + MySQL terhubung.'
                exit 0
              }
            } catch { Start-Sleep -Seconds 2 }
          }
          throw 'Deployment belum sehat setelah 120 detik. Periksa docker compose ps dan logs.'

  deploy:
    name: CD - Deploy to VPS (optional)
    needs: publish
    if: vars.ENABLE_VPS_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH key and verified server fingerprint
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Transfer compose configuration and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/database'"
          scp compose.prod.yaml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/compose.prod.yaml"
          scp database/init.sql "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/database/init.sql"
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY,,}"
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd '$DEPLOY_PATH' && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' docker compose -f compose.prod.yaml pull && IMAGE_PREFIX='$IMAGE_PREFIX' IMAGE_TAG='$GITHUB_SHA' docker compose -f compose.prod.yaml up -d --remove-orphans"

